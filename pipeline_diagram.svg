<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-label="Pipeline diagram: raw heartbeat flows through preprocessing into a binary screening transformer, which branches to a normal output or into a second multiclass diagnosis transformer producing one of four abnormal subtypes.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#131C17"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="480" height="560" fill="#FFFFFF"/>

  <!-- Raw signal -->
  <rect x="140" y="16" width="200" height="54" rx="8" fill="#FFFFFF" stroke="#131C17" stroke-width="1.4"/>
  <text x="240" y="38" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#131C17">Raw heartbeat</text>
  <text x="240" y="55" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#57655D">140 steps &#183; 1 channel</text>

  <line x1="240" y1="70" x2="240" y2="93" stroke="#131C17" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Preprocess -->
  <rect x="140" y="96" width="200" height="54" rx="8" fill="#FFFFFF" stroke="#131C17" stroke-width="1.4"/>
  <text x="240" y="118" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#131C17">Preprocess</text>
  <text x="240" y="135" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#57655D">StandardScaler, train-fit only</text>

  <line x1="240" y1="150" x2="240" y2="173" stroke="#131C17" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Stage 1 -->
  <rect x="100" y="176" width="280" height="104" rx="9" fill="#DDEFE6" stroke="#0E5A45" stroke-width="1.6"/>
  <text x="240" y="201" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E5A45">Stage 1 &#183; Screen</text>
  <text x="240" y="220" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#131C17">BaseTransformerClassifier (binary)</text>
  <text x="240" y="238" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#57655D">d_model 64 &#183; 4 heads &#183; 1 layer</text>
  <text x="240" y="255" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#57655D">class-weighted cross-entropy</text>

  <!-- Branches -->
  <line x1="240" y1="280" x2="120" y2="337" stroke="#131C17" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="240" y1="280" x2="360" y2="337" stroke="#131C17" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="140" y="298" width="90" height="20" rx="4" fill="#F5F7F5"/>
  <text x="185" y="312" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#131C17">predicted normal</text>

  <rect x="255" y="298" width="100" height="20" rx="4" fill="#F5F7F5"/>
  <text x="305" y="312" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#B4562B">predicted abnormal</text>

  <!-- Normal terminal -->
  <rect x="16" y="340" width="190" height="66" rx="8" fill="#FFFFFF" stroke="#131C17" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="111" y="366" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#131C17">Output</text>
  <text x="111" y="383" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#57655D">Normal beat</text>

  <!-- Stage 2 -->
  <rect x="274" y="340" width="200" height="112" rx="9" fill="#F5E4DA" stroke="#B4562B" stroke-width="1.6"/>
  <text x="374" y="365" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#B4562B">Stage 2 &#183; Diagnose</text>
  <text x="374" y="383" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10.7" fill="#131C17">Same architecture, retrained</text>
  <text x="374" y="399" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10.7" fill="#131C17">on abnormal-only beats</text>
  <text x="374" y="417" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#57655D">4-class softmax head</text>
  <text x="374" y="433" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#57655D">class-weighted cross-entropy</text>

  <line x1="374" y1="452" x2="374" y2="473" stroke="#131C17" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Stage2 terminal -->
  <rect x="279" y="476" width="190" height="60" rx="8" fill="#FFFFFF" stroke="#131C17" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="374" y="500" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#131C17">Output</text>
  <text x="374" y="517" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#57655D">Abnormal subtype, 1 of 4</text>
</svg>
